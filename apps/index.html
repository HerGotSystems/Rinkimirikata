<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RINKIMIRIKATA / Apps</title>
<style>
body{margin:0;background:#080808;color:#eee;font-family:monospace;padding:32px;line-height:1.5}h1{font-size:clamp(34px,7vw,72px);margin:0 0 8px;letter-spacing:-.06em}p{color:#aaa;max-width:760px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:28px}.card{border:1px solid #252525;background:#111;padding:18px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between}.type{color:#f0c33a;font-size:11px;text-transform:uppercase;letter-spacing:.12em}.title{font-size:24px;margin:10px 0;color:#fff}.desc{color:#aaa;font-size:14px}.open{display:inline-block;margin-top:16px;color:#f0c33a;text-transform:uppercase;font-size:12px;letter-spacing:.12em}.empty{border:1px dashed #333;padding:20px;color:#777;margin-top:24px}a{color:inherit;text-decoration:none}</style>
</head>
<body>
<h1>APPS</h1>
<p>Registry-driven app index. Add items to <code>/registry/apps.json</code> and put standalone tools inside <code>/apps/app-name/index.html</code>.</p>
<div id="apps" class="grid"></div>
<div id="empty" class="empty" hidden>No registry items found.</div>
<script>
async function loadApps(){
  const root=document.getElementById('apps');
  const empty=document.getElementById('empty');
  try{
    const res=await fetch('/registry/apps.json',{cache:'no-store'});
    const data=await res.json();
    const items=(data.items||[]).filter(x=>x.url && x.url.startsWith('/apps/'));
    if(!items.length){empty.hidden=false;return;}
    root.innerHTML=items.map(app=>`<a class="card" href="${app.url}"><div><div class="type">${escapeHtml(app.type||app.status||'app')}</div><div class="title">${escapeHtml(app.title||app.id)}</div><div class="desc">${escapeHtml(app.description||'')}</div></div><div class="open">Open →</div></a>`).join('');
  }catch(err){empty.hidden=false;empty.textContent='Could not load /registry/apps.json';}
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
loadApps();
</script>
</body>
</html>
