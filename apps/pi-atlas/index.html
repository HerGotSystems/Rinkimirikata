<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RINKIMIRIKATA / Pi Atlas</title><style>body{margin:0;background:#050505;color:#eee;font-family:monospace}main{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0}h1{font-size:clamp(40px,8vw,88px);letter-spacing:-.08em;line-height:.9;margin:20px 0}.panel{border:1px solid #272727;background:#111;padding:16px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button,input{background:#080808;color:#eee;border:1px solid #333;padding:10px;font:inherit}button:hover{border-color:#c8960a;color:#c8960a}canvas{width:100%;height:520px;background:#000;border:1px solid #272727;display:block}.muted{color:#999;line-height:1.5}a{color:#c8960a;text-decoration:none}</style></head><body><main><a href="/">← hub</a><h1>PI ATLAS</h1><p class="muted">Starter shell for the Pi Atlas visualizer. This is the public route where the real engine can be dropped in. Current version renders a numeric spiral placeholder and keeps the browser-local pattern ready for audio/text input.</p><div class="panel"><div class="row"><input id="text" value="3141592653589793238462643383279"><button id="drawBtn">Redraw</button><button id="recBtn">Start Recording</button><a id="dl" hidden download="pi-atlas.webm">Download recording</a></div></div><canvas id="c" width="1280" height="720"></canvas></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),text=document.getElementById('text'),dl=document.getElementById('dl'),recBtn=document.getElementById('recBtn');let t=0,rec,chunks=[],recording=false;function draw(){requestAnimationFrame(draw);t+=.01;x.fillStyle='rgba(0,0,0,.16)';x.fillRect(0,0,c.width,c.height);const s=text.value||'314159';const cx=c.width/2,cy=c.height/2;for(let i=0;i<900;i++){const d=Number(s[i%s.length])||0;const a=i*.19+t*(.2+d*.03);const r=8+i*.38+d*1.7;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;const size=2+d*.45;x.fillStyle='hsl('+((d*32+i*.05)%360)+',80%,'+(42+d*4)+'%)';x.fillRect(px,py,size,size)}}document.getElementById('drawBtn').onclick=()=>{x.clearRect(0,0,c.width,c.height)};recBtn.onclick=()=>{if(!recording){rec=new MediaRecorder(c.captureStream(30),{mimeType:'video/webm'});chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{dl.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));dl.hidden=false};rec.start();recording=true;recBtn.textContent='Stop Recording'}else{rec.stop();recording=false;recBtn.textContent='Start Recording'}};draw();</script></body></html>
