<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PRIMORDIAL v2</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020408;--sur:#07090f;--sur2:#0b0e16;--brd:#13192a;--tx:#556688;--txb:#99aabb;--acc:#00e5cc;--dim:#0e1220}
body{background:var(--bg);color:var(--tx);font-family:'Space Mono',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--brd);background:var(--sur);flex-shrink:0}
.logo{font-family:'Orbitron',monospace;font-size:15px;font-weight:900;color:var(--acc);letter-spacing:5px}
.logo-sub{font-size:7px;letter-spacing:4px;color:var(--tx);margin-top:2px}
.hmeta{font-size:7px;letter-spacing:2px;color:var(--tx);text-align:right;line-height:1.9}
.hmeta em{color:var(--acc);font-style:normal}
.scene-bar{display:flex;border-bottom:1px solid var(--brd);flex-shrink:0;background:var(--sur2)}
.sbtn{flex:1;padding:8px 4px;background:transparent;border:none;border-right:1px solid var(--brd);color:var(--tx);font-family:'Space Mono',monospace;font-size:7px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .12s;text-align:center;line-height:1.7}
.sbtn:last-child{border-right:none}
.sbtn:hover{color:var(--txb);background:var(--dim)}
.sbtn.on{background:var(--dim);color:var(--acc);border-bottom:2px solid var(--acc)}
.sico{display:block;font-size:13px;margin-bottom:2px}
.main{display:flex;flex:1;overflow:hidden}
.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;background:#010306;position:relative;overflow:hidden}
canvas{max-width:100%;max-height:100%}
.overlay{position:absolute;bottom:10px;left:12px;font-size:7px;letter-spacing:2px;color:rgba(0,229,204,.2);pointer-events:none}
.sidebar{width:272px;background:var(--sur);border-left:1px solid var(--brd);display:flex;flex-direction:column;overflow:hidden}
.sidebar-scroll{flex:1;overflow-y:auto}
.sidebar-scroll::-webkit-scrollbar{width:2px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--brd)}
.sec{border-bottom:1px solid var(--brd)}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;transition:background .12s}
.sec-head:hover{background:var(--dim)}
.sec-title{font-size:8px;letter-spacing:2.5px;color:var(--acc);text-transform:uppercase}
.sec-meta{display:flex;gap:6px}
.sec-meta button{background:none;border:1px solid var(--brd);color:var(--tx);font-family:'Space Mono',monospace;font-size:7px;cursor:pointer;padding:1px 5px;transition:color .1s}
.sec-meta button:hover{color:var(--acc)}
.sec-body{padding:6px 10px 10px;display:none}
.sec-body.open{display:block}
.chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:4px}
.chip{background:var(--dim);border:1px solid var(--brd);color:var(--tx);font-family:'Space Mono',monospace;font-size:7px;padding:6px;cursor:pointer;text-align:left;transition:all .12s;line-height:1.5}
.chip:hover{border-color:var(--acc);color:var(--txb)}
.chip.on{background:rgba(0,229,204,.08);border-color:var(--acc);color:var(--acc)}
.chip-name{font-weight:700;font-size:7.5px}
.chip-info{font-size:6px;opacity:.6;margin-top:1px}
.ctrl{margin-bottom:9px}
.clabel{font-size:7px;letter-spacing:2px;display:flex;justify-content:space-between;margin-bottom:4px}
.clabel em{color:var(--acc);font-style:normal}
input[type=range]{-webkit-appearance:none;width:100%;height:2px;background:var(--brd);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;background:var(--acc);cursor:pointer}
input[type=text]{width:100%;background:var(--dim);border:1px solid var(--brd);color:var(--txb);font-family:'Space Mono',monospace;font-size:10px;padding:7px 10px;outline:none;letter-spacing:2px}
input[type=text]:focus{border-color:var(--acc)}
.abtn{width:100%;background:transparent;border:1px solid var(--brd);color:var(--tx);font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;padding:9px;cursor:pointer;text-transform:uppercase;transition:all .12s;display:block;text-align:center;margin-bottom:4px}
.abtn:hover{border-color:var(--acc);color:var(--acc)}
.abtn.pri{border-color:var(--acc);color:var(--acc);font-weight:700}
.abtn.pri:hover{background:var(--acc);color:#000}
.sbot{flex-shrink:0;padding:12px;border-top:1px solid var(--brd)}
</style>
</head>
<body>
<header>
  <div><div class="logo">PRIMORDIAL</div><div class="logo-sub">SCIENCE ART GENERATOR v2</div></div>
  <div class="hmeta">EMVY CHECK<br><em id="hSeed">PRIMORDIAL</em></div>
</header>
<div class="scene-bar">
  <button class="sbtn on" data-scene="AIR"><span class="sico">&#127788;</span>AIR</button>
  <button class="sbtn" data-scene="WATER"><span class="sico">&#128167;</span>WATER</button>
  <button class="sbtn" data-scene="CELL"><span class="sico">&#128300;</span>CELL</button>
  <button class="sbtn" data-scene="BLOOD"><span class="sico">&#129656;</span>BLOOD</button>
  <button class="sbtn" data-scene="QUANTUM"><span class="sico">&#9883;</span>QUANTUM</button>
  <button class="sbtn" data-scene="CUSTOM"><span class="sico">&#9883;</span>CUSTOM</button>
</div>
<div class="main">
  <div class="canvas-area">
    <canvas id="c" width="880" height="840"></canvas>
    <div class="overlay" id="overlay">AIR</div>
  </div>
  <div class="sidebar">
    <div class="sidebar-scroll" id="elScroll"></div>
    <div class="sbot">
      <div class="sec-title" style="margin-bottom:10px">PARAMETERS</div>
      <div class="ctrl"><div class="clabel">DENSITY <em id="vD">65</em></div><input type="range" id="density" min="5" max="100" value="65"></div>
      <div class="ctrl"><div class="clabel">SCALE <em id="vS">50</em></div><input type="range" id="scale" min="10" max="100" value="50"></div>
      <div class="ctrl"><div class="clabel">DETAIL <em id="vDt">60</em></div><input type="range" id="detail" min="0" max="100" value="60"></div>
      <div class="ctrl" style="margin-bottom:12px"><div class="clabel">GLOW <em id="vG">55</em></div><input type="range" id="glow" min="0" max="100" value="55"></div>
      <input type="text" id="seedInp" value="PRIMORDIAL" maxlength="20" style="margin-bottom:8px" spellcheck="false">
      <button class="abtn pri" id="btnGen">GENERATE</button>
      <button class="abtn" id="btnRand">RANDOM SEED</button>
      <button class="abtn" id="btnExp">EXPORT PNG</button>
    </div>
  </div>
</div>
<script>
// PRIMORDIAL v2 - EMVY CHECK

function strHash(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function mkRNG(seed){var s=typeof seed==='string'?strHash(seed):(seed>>>0);return function(){s|=0;s=(s+0x6D2B79F5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var DEG=Math.PI/180;
var SEED='PRIMORDIAL';
var SCENE='AIR';
var activeElems=new Set();
var RNG=mkRNG(SEED);
var P={};

function setPal(scene){
  if(scene==='AIR')    {P={p:'#88ccff',s:'#aaddff',a:'#ff88aa',mid:'#6699cc',bg:'#030610',dim:'#080e1c'};}
  else if(scene==='WATER') {P={p:'#00ddcc',s:'#44ffee',a:'#7788ff',mid:'#009988',bg:'#010c10',dim:'#031418'};}
  else if(scene==='CELL')  {P={p:'#ffaa44',s:'#ffdd88',a:'#ff6644',mid:'#cc7722',bg:'#0a0600',dim:'#150b00'};}
  else if(scene==='BLOOD') {P={p:'#ff4444',s:'#ff8888',a:'#ffaa44',mid:'#cc2222',bg:'#080002',dim:'#150005'};}
  else if(scene==='QUANTUM'){P={p:'#aa88ff',s:'#cc99ff',a:'#ff99cc',mid:'#8866cc',bg:'#020008',dim:'#0a0416'};}
  else                     {P={p:'#00e5cc',s:'#7dff44',a:'#ff44cc',mid:'#00aa88',bg:'#020408',dim:'#0a1018'};}
}

function rgba(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')';}
function glo(col,blur){ctx.shadowColor=col;ctx.shadowBlur=blur;}
function nog(){ctx.shadowBlur=0;ctx.setLineDash([]);}

// BACKGROUNDS
function baseBG(W,H,rng){
  ctx.fillStyle=P.bg;ctx.fillRect(0,0,W,H);
  var gs=24;
  for(var x=gs;x<W;x+=gs)for(var y=gs;y<H;y+=gs){ctx.beginPath();ctx.arc(x,y,0.7,0,Math.PI*2);ctx.fillStyle=rgba(P.p,0.05);ctx.fill();}
  for(var i=0;i<400;i++){ctx.beginPath();ctx.arc(rng()*W,rng()*H,0.5+rng()*0.8,0,Math.PI*2);ctx.fillStyle=rgba(P.p,0.01+rng()*0.02);ctx.fill();}
}
function vig(W,H){var v=ctx.createRadialGradient(W/2,H/2,W*0.12,W/2,H/2,W*0.8);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.65)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);}

function bgAir(W,H,rng){
  baseBG(W,H,rng);
  var gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,rgba(P.p,0.06));gr.addColorStop(1,rgba(P.p,0));ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  for(var i=0;i<120;i++){ctx.beginPath();ctx.arc(rng()*W,rng()*H,0.3+rng()*0.8,0,Math.PI*2);ctx.fillStyle=rgba(P.s,0.06+rng()*0.05);ctx.fill();}
  vig(W,H);
}
function bgWater(W,H,rng){
  baseBG(W,H,rng);
  var gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,rgba(P.p,0.14));gr.addColorStop(0.4,rgba(P.p,0.04));gr.addColorStop(1,rgba(P.p,0));ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  var lx;
  for(var i=0;i<30;i++){lx=rng()*W;ctx.beginPath();ctx.moveTo(lx,0);for(var j=0;j<10;j++){lx+=(rng()-0.5)*25;ctx.lineTo(lx,(j+1)/10*H*0.55);}ctx.strokeStyle=rgba(P.s,0.04+rng()*0.05);ctx.lineWidth=0.4+rng()*0.8;ctx.stroke();}
  ctx.beginPath();for(var i=0;i<=100;i++){var t=i/100;ctx.lineTo(t*W,H*0.08+Math.sin(t*12)*8);}ctx.strokeStyle=rgba(P.p,0.12);ctx.lineWidth=1;ctx.stroke();
  vig(W,H);
}
function bgCell(W,H,rng){
  baseBG(W,H,rng);
  var gr=ctx.createRadialGradient(W/2,H/2,W*0.05,W/2,H/2,W*0.65);gr.addColorStop(0,rgba(P.p,0.1));gr.addColorStop(1,rgba(P.p,0));ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.beginPath();ctx.ellipse(W/2,H/2,W*0.46,H*0.46,0,0,Math.PI*2);ctx.strokeStyle=rgba(P.p,0.18);ctx.lineWidth=4;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);
  for(var i=0;i<600;i++){var rx=rng()*W,ry=rng()*H;if(Math.pow((rx-W/2)/(W*0.46),2)+Math.pow((ry-H/2)/(H*0.46),2)<1){ctx.beginPath();ctx.arc(rx,ry,1,0,Math.PI*2);ctx.fillStyle=rgba(P.a,0.1);ctx.fill();}}
  for(var i=0;i<8;i++){var y0=rng()*H;ctx.beginPath();ctx.moveTo(0,y0);for(var x=0;x<W;x+=20)ctx.lineTo(x+(rng()-0.5)*30,y0+Math.sin(x*0.05)*20);ctx.strokeStyle=rgba(P.mid,0.05);ctx.lineWidth=0.5;ctx.stroke();}
  vig(W,H);
}
function bgBlood(W,H,rng){
  baseBG(W,H,rng);
  var gr=ctx.createRadialGradient(W/2,H/2,W*0.1,W/2,H/2,W*0.75);gr.addColorStop(0,rgba(P.p,0.1));gr.addColorStop(1,rgba(P.p,0));ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  for(var i=0;i<15;i++){var y0=rng()*H;ctx.beginPath();ctx.moveTo(0,y0);for(var x=0;x<W;x+=40)ctx.lineTo(x+(rng()-0.5)*20,y0+(rng()-0.5)*8);ctx.strokeStyle=rgba(P.mid,0.07);ctx.lineWidth=0.5;ctx.stroke();}
  for(var i=0;i<40;i++){var x1=rng()*W,y1=rng()*H;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1+(rng()-0.5)*60,y1+(rng()-0.5)*60);ctx.strokeStyle=rgba(P.s,0.06);ctx.lineWidth=0.5;ctx.stroke();}
  vig(W,H);
}
function bgQuantum(W,H,rng){
  baseBG(W,H,rng);
  for(var x=0;x<W;x+=3)for(var y=0;y<H;y+=3){var v2=Math.sin(x*0.04)*Math.cos(y*0.04)+Math.sin((x+y)*0.025);if(v2>0.5){ctx.beginPath();ctx.arc(x,y,0.6,0,Math.PI*2);ctx.fillStyle=rgba(P.p,0.04);ctx.fill();}}
  vig(W,H);
}

// BOND HELPERS
function bnd1(x1,y1,x2,y2,col,a){a=a||0.7;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=rgba(col,a);ctx.lineWidth=1.4;ctx.stroke();}
function bnd2(x1,y1,x2,y2,col,a){a=a||0.7;var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)+0.001,nx=-dy/len*2.2,ny=dx/len*2.2;ctx.beginPath();ctx.moveTo(x1+nx,y1+ny);ctx.lineTo(x2+nx,y2+ny);ctx.moveTo(x1-nx,y1-ny);ctx.lineTo(x2-nx,y2-ny);ctx.strokeStyle=rgba(col,a);ctx.lineWidth=1.2;ctx.stroke();}
function bnd3(x1,y1,x2,y2,col,a){a=a||0.7;var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)+0.001,nx=-dy/len*2.5,ny=dx/len*2.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.moveTo(x1+nx,y1+ny);ctx.lineTo(x2+nx,y2+ny);ctx.moveTo(x1-nx,y1-ny);ctx.lineTo(x2-nx,y2-ny);ctx.strokeStyle=rgba(col,a);ctx.lineWidth=1;ctx.stroke();}
function aCirc(x,y,r,sym,col){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=rgba(col,0.2);ctx.fill();ctx.strokeStyle=rgba(col,0.85);ctx.lineWidth=0.9;ctx.stroke();ctx.fillStyle=rgba(col,0.95);ctx.font='bold '+Math.max(5,r*0.9)+'px "Space Mono"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sym,x,y);}
function ann(txt,x,y,sz){sz=sz||6;ctx.fillStyle=rgba(P.p,0.28);ctx.font=sz+'px "Space Mono"';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(txt,x,y);}

// MOLECULES
function mH2O(s,sh){
  var b=28*s,ha=52.25*DEG,h1x=Math.sin(-ha)*b,h1y=Math.cos(ha)*b,h2x=Math.sin(ha)*b,h2y=Math.cos(ha)*b;
  ctx.save();ctx.setLineDash([2,2]);
  ctx.beginPath();ctx.ellipse(-s*5,-s*11,s*4,s*2.5,-0.5,0,Math.PI*2);ctx.strokeStyle=rgba(P.p,0.22);ctx.lineWidth=0.6;ctx.stroke();
  ctx.beginPath();ctx.ellipse(s*5,-s*11,s*4,s*2.5,0.5,0,Math.PI*2);ctx.stroke();ctx.restore();
  bnd1(0,0,h1x,h1y,P.p);bnd1(0,0,h2x,h2y,P.p);
  ctx.fillStyle=rgba(P.a,0.4);ctx.font=Math.max(5,s*6)+'px "Space Mono"';ctx.textBaseline='middle';ctx.textAlign='center';
  ctx.fillText('d-',-s*13,-s*10);ctx.fillText('d+',h1x-5,h1y+2);ctx.fillText('d+',h2x+5,h2y+2);
  aCirc(0,0,s*8,'O','#ff4455');aCirc(h1x,h1y,s*5,'H',P.p);aCirc(h2x,h2y,s*5,'H',P.p);
  if(sh)ann('104.5 | 96pm | 1.85D',0,h1y+s*10);
}
function mO2(s,sh){var b=26*s;bnd2(-b,0,b,0,'#ff4455');aCirc(-b,0,s*8,'O','#ff4455');aCirc(b,0,s*8,'O','#ff4455');ctx.beginPath();ctx.ellipse(0,0,b,s*12,0,0,Math.PI*2);ctx.strokeStyle=rgba(P.p,0.1);ctx.lineWidth=0.5;ctx.stroke();if(sh)ann('O=O | 121pm',0,s*15);}
function mN2(s,sh){var b=24*s;bnd3(-b,0,b,0,'#8888ff');aCirc(-b,0,s*8,'N','#8888ff');aCirc(b,0,s*8,'N','#8888ff');if(sh)ann('N triple-N | 110pm | 945kJ',0,s*14);}
function mCO2(s,sh){var b=28*s;bnd2(-b,0,0,0,P.p);bnd2(0,0,b,0,P.p);aCirc(0,0,s*8,'C',P.mid);aCirc(-b,0,s*8,'O','#ff4455');aCirc(b,0,s*8,'O','#ff4455');if(sh)ann('O=C=O | 180 | 116pm',0,s*14);}
function mCH4(s,sh){
  var b=26*s;
  var hP=[[0,-b],[-b*0.87,b*0.5],[b*0.87,b*0.5],[0,b*0.35]];
  hP.forEach(function(h,i){if(i===3){ctx.save();ctx.setLineDash([3,2]);bnd1(0,0,h[0],h[1],P.p,0.4);ctx.restore();}else bnd1(0,0,h[0],h[1],P.p);aCirc(h[0],h[1],s*5,'H',P.p);});
  aCirc(0,0,s*9,'C',P.mid);if(sh)ann('109.5 | Tetrahedral',0,b+s*8);
}
function mNH3(s,sh){
  var b=26*s,ha=107.8/2*DEG;
  var hP=[[-Math.sin(ha)*b,Math.cos(ha*1.3)*b],[Math.sin(ha)*b,Math.cos(ha*1.3)*b],[0,b*0.9]];
  ctx.save();ctx.setLineDash([2,2]);ctx.beginPath();ctx.ellipse(0,-s*14,s*5,s*3,0,0,Math.PI*2);ctx.strokeStyle=rgba(P.p,0.25);ctx.lineWidth=0.6;ctx.stroke();ctx.restore();
  hP.forEach(function(h){bnd1(0,0,h[0],h[1],P.p);aCirc(h[0],h[1],s*5,'H',P.p);});
  aCirc(0,0,s*8,'N','#8888ff');if(sh)ann('107.8 | Pyramidal | 1.47D',0,b+s*4);
}
function mO3(s,sh){
  var b=26*s,ha=117/2*DEG,o1x=-Math.sin(ha)*b,o1y=Math.cos(ha)*b*0.7,o2x=Math.sin(ha)*b,o2y=o1y;
  bnd1(0,0,o1x,o1y,P.a);ctx.save();ctx.setLineDash([4,3]);bnd1(0,0,o1x,o1y,P.a,0.3);ctx.restore();
  bnd2(0,0,o2x,o2y,P.a,0.65);
  aCirc(0,0,s*8,'O','#ff4455');aCirc(o1x,o1y,s*8,'O','#ff4455');aCirc(o2x,o2y,s*8,'O','#ff4455');
  if(sh)ann('117 | bond 1.5 | 0.53D',0,o1y+s*12);
}
function mNaCl(s,sh){
  var b=32*s;
  ctx.beginPath();ctx.moveTo(-b*0.6,0);ctx.lineTo(-b*0.15,0);ctx.strokeStyle=rgba(P.a,0.5);ctx.lineWidth=0.8;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-b*0.15,0);ctx.lineTo(-b*0.22,-s*3);ctx.lineTo(-b*0.22,s*3);ctx.closePath();ctx.fillStyle=rgba(P.a,0.5);ctx.fill();
  aCirc(-b,0,s*11,'Na','#8899ff');aCirc(b,0,s*13,'Cl','#44cc44');
  ctx.fillStyle=rgba(P.p,0.6);ctx.font=s*6+'px "Space Mono"';ctx.textBaseline='top';ctx.textAlign='left';ctx.fillText('+',(-b)+s*8,-s*14);ctx.fillText('-',b+s*9,-s*14);
  if(sh)ann('Ionic | dEN=2.1',0,s*18);
}
function mGlucose(s,sh){
  var r=s*22,atoms=['C','C','C','C','C','O'],cols=[P.mid,P.mid,P.mid,P.mid,P.mid,'#ff4455'];

  for(var n=0;n<Math.min(10,d.shells.length*3+2);n++){var na2=rng()*Math.PI*2,nr=rng()*nucR*0.65;ctx.beginPath();ctx.arc(x+Math.cos(na2)*nr,y+Math.sin(na2)*nr,1.3,0,Math.PI*2);ctx.fillStyle=rgba(n%2===0?P.p:P.a,0.75);ctx.fill();}
  ctx.fillStyle=rgba(P.p,0.95);ctx.font='bold '+Math.max(6,nucR*0.9)+'px "Space Mono"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.sym,x,y);
  d.shells.forEach(function(ne,si){
    var shellR=nucR+(si+1)*sc,tilt=0.3+rng()*0.4,sang=rng()*Math.PI;
    ctx.save();ctx.translate(x,y);ctx.rotate(sang);ctx.scale(1,tilt);ctx.beginPath();ctx.arc(0,0,shellR,0,Math.PI*2);ctx.strokeStyle=rgba(P.p,0.18);ctx.lineWidth=0.55;ctx.stroke();ctx.restore();
    for(var e=0;e<ne;e++){var ea=sang+(e/ne)*Math.PI*2;var ex=x+Math.cos(ea)*shellR,ey=y+Math.sin(ea)*shellR*tilt;glo(P.a,gl*8);ctx.beginPath();ctx.arc(ex,ey,2.3,0,Math.PI*2);ctx.fillStyle=rgba(P.a,0.9);ctx.fill();nog();}
  });
  if(det>0.5){ctx.fillStyle=rgba(P.p,0.2);ctx.font='7px "Space Mono"';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('Z='+d.an+' | '+d.mass+'u | '+d.ec,x,y+(nucR+d.shells.length*sc)+4);}
}

function dWave(x,y,W2,amp,wl,gl){
  glo(P.p,gl*6);ctx.beginPath();
  for(var i=0;i<=100;i++){var t=i/100,px=x-W2/2+t*W2,env=amp*Math.exp(-Math.pow((t-0.5)*4.2,2));ctx.lineTo(px,y+env*Math.sin(t*W2/wl*Math.PI*2));}
  ctx.strokeStyle=rgba(P.p,0.72);ctx.lineWidth=1.2;ctx.stroke();nog();
  ctx.beginPath();for(var i=0;i<=100;i++){var t=i/100,px=x-W2/2+t*W2,env=amp*Math.exp(-Math.pow((t-0.5)*4.2,2));ctx.lineTo(px,y-env);}
  for(var i=100;i>=0;i--){var t=i/100,px=x-W2/2+t*W2,env=amp*Math.exp(-Math.pow((t-0.5)*4.2,2));ctx.lineTo(px,y+env);}
  ctx.fillStyle=rgba(P.p,0.04);ctx.fill();
}
function dCloud(x,y,wx,hy,den,rng){
  var pts=Math.floor(den*280);
  for(var i=0;i<pts;i++){var u=Math.max(1e-6,rng()),v=rng();var z1=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);var z2=Math.sqrt(-2*Math.log(u))*Math.sin(2*Math.PI*v);var px=x+z1*wx*0.27,py=y+z2*hy*0.27;var dist=Math.sqrt(Math.pow(px-x,2)/Math.pow(wx*0.27,2)+Math.pow(py-y,2)/Math.pow(hy*0.27,2));var al=Math.max(0,0.75-dist*0.6)*(0.18+rng()*0.45);ctx.beginPath();ctx.arc(px,py,0.7+rng()*1.2,0,Math.PI*2);ctx.fillStyle=rgba(P.p,al);ctx.fill();}
}
function dDipole(x1,y1,x2,y2,n,rng){
  for(var l=0;l<n;l++){var sa=(l/n)*Math.PI*2+rng()*0.1;var px2=x1+Math.cos(sa)*6,py2=y1+Math.sin(sa)*6;ctx.beginPath();ctx.moveTo(px2,py2);for(var step=0;step<50;step++){var dx1=px2-x1,dy1=py2-y1,r1=Math.sqrt(dx1*dx1+dy1*dy1)+0.01;var dx2=px2-x2,dy2=py2-y2,r2=Math.sqrt(dx2*dx2+dy2*dy2)+0.01;var fx=dx1/(r1*r1*r1)-dx2/(r2*r2*r2);var fy=dy1/(r1*r1*r1)-dy2/(r2*r2*r2);var fm=Math.sqrt(fx*fx+fy*fy)+0.001;px2+=fx/fm*9;py2+=fy/fm*9;ctx.lineTo(px2,py2);if(Math.sqrt(Math.pow(px2-x2,2)+Math.pow(py2-y2,2))<10)break;}ctx.strokeStyle=rgba(P.s,0.2+(l/n)*0.12);ctx.lineWidth=0.55;ctx.stroke();}
  [[x1,y1,1],[x2,y2,0]].forEach(function(c){ctx.beginPath();ctx.arc(c[0],c[1],7,0,Math.PI*2);ctx.fillStyle=rgba(P.s,c[2]?0.6:0.1);ctx.fill();ctx.strokeStyle=rgba(P.s,0.85);ctx.lineWidth=1;ctx.stroke();ctx.fillStyle=rgba(P.s,0.95);ctx.font='11px "Space Mono"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c[2]?'+':'-',c[0],c[1]);});
}
function _lt(x1,y1,x2,y2,dep,rng){if(dep<=0){ctx.lineTo(x2,y2);return;}var mx=(x1+x2)/2,my=(y1+y2)/2;var len=Math.sqrt(Math.pow(x2-x1,2)+Math.pow(y2-y1,2));var off=(rng()-0.5)*len*0.42;var nx=mx+(-(y2-y1)/len)*off,ny=my+((x2-x1)/len)*off;_lt(x1,y1,nx,ny,dep-1,rng);_lt(nx,ny,x2,y2,dep-1,rng);}
function dArc(x1,y1,x2,y2,gl,rng){glo(P.a,gl*22);ctx.beginPath();ctx.moveTo(x1,y1);_lt(x1,y1,x2,y2,5,rng);ctx.strokeStyle=rgba(P.a,0.3);ctx.lineWidth=2.5;ctx.stroke();nog();glo(P.p,gl*9);ctx.beginPath();ctx.moveTo(x1,y1);_lt(x1,y1,x2,y2,4,rng);ctx.strokeStyle=rgba(P.p,0.88);ctx.lineWidth=0.9;ctx.stroke();nog();glo(P.a,gl*12);ctx.beginPath();ctx.arc(x2,y2,4,0,Math.PI*2);ctx.fillStyle=rgba(P.a,0.7);ctx.fill();nog();}
function dLiss(x,y,rx,ry,a,b,ph,col,gl){glo(col,gl*5);ctx.beginPath();for(var i=0;i<=200;i++){var t=i/200*Math.PI*2;ctx.lineTo(x+Math.cos(a*t+ph)*rx,y+Math.sin(b*t)*ry);}ctx.strokeStyle=rgba(col,0.45);ctx.lineWidth=0.9;ctx.stroke();nog();}

function buildUI(){
  var scroll=document.getElementById('elScroll');
  scroll.innerHTML='';
  var groups={};
  Object.keys(ELEM).forEach(function(k){var e=ELEM[k];(groups[e.cat]=groups[e.cat]||[]).push([k,e]);});
  CAT_ORDER.forEach(function(cat){
    var sec=document.createElement('div');sec.className='sec';
    var head=document.createElement('div');head.className='sec-head';
    head.innerHTML='<span class="sec-title">'+cat+'</span><span class="sec-meta"><button data-cat="'+cat+'" data-op="all">ALL</button><button data-cat="'+cat+'" data-op="none">NONE</button></span>';
    var body=document.createElement('div');body.className='sec-body';
    var grid=document.createElement('div');grid.className='chip-grid';
    (groups[cat]||[]).forEach(function(pair){
      var k=pair[0],e=pair[1];
      var chip=document.createElement('button');chip.className='chip'+(activeElems.has(k)?' on':'');chip.dataset.key=k;
      chip.innerHTML='<div class="chip-name">'+e.name+'</div><div class="chip-info">'+e.info+'</div>';
      chip.addEventListener('click',function(){if(activeElems.has(k))activeElems.delete(k);else activeElems.add(k);chip.classList.toggle('on');generate();});
      grid.appendChild(chip);
    });
    body.appendChild(grid);sec.appendChild(head);sec.appendChild(body);scroll.appendChild(sec);
    head.addEventListener('click',function(ev){if(ev.target.tagName==='BUTTON')return;body.classList.toggle('open');});
    head.querySelectorAll('button').forEach(function(btn){btn.addEventListener('click',function(ev){ev.stopPropagation();(groups[btn.dataset.cat]||[]).forEach(function(pair){if(btn.dataset.op==='all')activeElems.add(pair[0]);else activeElems.delete(pair[0]);});syncChips();generate();});});
  });
  var bodies=scroll.querySelectorAll('.sec-body');
  if(bodies[0])bodies[0].classList.add('open');
  if(bodies[3])bodies[3].classList.add('open');
}

function syncChips(){document.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',activeElems.has(c.dataset.key));});}

function generate(){
  var W=canvas.width,H=canvas.height;
  RNG=mkRNG(SEED);setPal(SCENE);
  var density=parseInt(document.getElementById('density').value)/100;
  var scale=parseInt(document.getElementById('scale').value)/100*1.5+0.25;
  var detail=parseInt(document.getElementById('detail').value)/100;
  var gl=parseInt(document.getElementById('glow').value)/100;
  if(SCENE==='AIR')bgAir(W,H,RNG);else if(SCENE==='WATER')bgWater(W,H,RNG);else if(SCENE==='CELL')bgCell(W,H,RNG);else if(SCENE==='BLOOD')bgBlood(W,H,RNG);else if(SCENE==='QUANTUM')bgQuantum(W,H,RNG);else bgAir(W,H,RNG);
  var ord={MOLECULES:0,ATOMS:1,PHYSICS:2,MICROBIAL:3,VIRAL:4,ORGANIC:5};
  var ordered=Array.from(activeElems).sort(function(a,b){return(ord[ELEM[a]&&ELEM[a].cat]||3)-(ord[ELEM[b]&&ELEM[b].cat]||3);});
  ordered.forEach(function(k){
    var el=ELEM[k];if(!el)return;
    var count=Math.floor(density*el.freq);
    for(var i=0;i<count;i++){
      var x=RNG()*W,y=RNG()*H;var s=scale*(el.sMin+RNG()*(el.sMax-el.sMin));
      el.draw(x,y,s,gl,RNG,detail);
      if(detail>0.65&&RNG()<0.2){ctx.fillStyle=rgba(P.p,0.18);ctx.font='6px "Space Mono"';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(el.name,x+s*22,y-s*10);}
    }
  });
  ctx.fillStyle=rgba(P.p,0.07);ctx.font='7px "Space Mono"';ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('PRIMORDIAL v2 | '+SCENE+' | '+SEED+' | EMVY CHECK',W-10,H-8);
  document.getElementById('overlay').textContent=SCENE+' | '+SEED;
  document.getElementById('hSeed').textContent=SEED;
}

document.getElementById('seedInp').addEventListener('change',function(e){SEED=e.target.value.trim()||'PRIMORDIAL';generate();});

document.getElementById('btnGen').addEventListener('click',generate);
document.getElementById('btnRand').addEventListener('click',function(){var c='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',s='';for(var i=0;i<9;i++)s+=c[Math.floor(Math.random()*c.length)];document.getElementById('seedInp').value=s;SEED=s;generate();});
document.getElementById('btnExp').addEventListener('click',function(){var oW=canvas.width,oH=canvas.height;canvas.width=2400;canvas.height=2400;generate();var link=document.createElement('a');link.download='PRIMORDIAL_v2_'+SCENE+'_'+SEED+'.png';link.href=canvas.toDataURL('image/png');link.click();canvas.width=oW;canvas.height=oH;generate();});

buildUI();
activeElems=new Set(SCENES.AIR);
syncChips();
generate();
</script>
